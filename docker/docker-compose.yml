
################################################################################
# ColdBox Docker Compose Stack
# Runs the ColdBox application with MySQL 8 and CommandBox.
# Configure passwords in your local .env file.
################################################################################

services:

  ## PostgreSQL (optional)
  # coldbox_db:
  #   image: postgres:12
  #   environment:
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  #     POSTGRES_USER: ${DB_USER:-coldbox}
  #     POSTGRES_DB: ${DB_DATABASE:-coldbox}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - .db/postgres/initdb:/docker-entrypoint-initdb.d
  #     - .db/postgres/data:/var/lib/postgresql/data

  ## Microsoft SQL Server (optional)
  # mssql:
  #   image: mcr.microsoft.com/azure-sql-edge:latest
  #   ports:
  #     - "1434:1433"
  #   environment:
  #     SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
  #     ACCEPT_EULA: "Y"
  #   volumes:
  #     - .db/mssql/tmp:/tmp/mssql

  ## MySQL Server 8
  coldbox_db:
    image: mysql:8
    ports:
      - "4306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-coldbox}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Store database data locally
      - .db/mysql8/data:/var/lib/mysql
      # Optional: seed the database with SQL files
      # - ../resources/sql/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ## ColdBox Application
  coldbox_app:
    
    image: ortussolutions/commandbox:lucee7
    depends_on:
      coldbox_db:
        condition: service_healthy
    environment:
      LUCEE_ADMIN_PASSWORD: ${LUCEE_ADMIN_PASSWORD}
      CFCONFIG_ADMINPASSWORD: ${CFCONFIG_ADMINPASSWORD:?Set CFCONFIG_ADMINPASSWORD in .env}
      ENVIRONMENT: DEVELOPMENT
  
      # Set a strong JWT secret if your application uses JWT.
      # JWT_SECRET: ${JWT_SECRET}

      DB_HOST: coldbox_db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-coldbox}
      DB_DRIVER: MySQL
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_CONNECTIONSTRING: jdbc:mysql://coldbox_db:3306/${DB_DATABASE:-coldbox}?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true

    ports:
      - "8080:8080"
      - "8443:8443"

    volumes:
      - ../:/app
